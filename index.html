<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Value Converter</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px; /* মোবাইল ও পিসিতে সুন্দর দেখানোর জন্য কমপ্যাক্ট সাইজ */
            padding: 20px;
            box-sizing: border-box;
        }

        /* ক্যালকুলেটরের ঠিক ওপরে ১টি মাত্র বিজ্ঞাপন স্পেস */
        .ad-container {
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            max-width: 100%;
            min-height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #141414;
            border: 1px dashed #333;
            border-radius: 6px;
        }

        .calculator-box {
            background: #141414;
            border: 1px solid #ffb703;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .calculator-box h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #ffb703;
            font-size: 20px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #ffb703;
        }

        /* ৬ ডিজিটের জন্য ছোট ও নিখুঁত ইনপুতের সাইজ */
        .input-group input {
            width: 100%;
            max-width: 150px; /* ইনপুট বক্সটি ছোট করা হয়েছে */
            padding: 10px 12px;
            background: #0d0d0d;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
        }

        .input-group input:focus {
            border-color: #ffb703;
            outline: none;
        }

        .calc-btn {
            width: 100%;
            padding: 14px;
            background: #ffb703;
            color: #0d0d0d;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .calc-btn:hover {
            background: #ffe066;
        }

        .calc-btn:active {
            transform: scale(0.98);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            background: #0d0d0d;
            border-radius: 6px;
            border-left: 4px solid #00cb49;
            display: none;
        }

        .result-box p {
            margin: 8px 0;
            font-size: 15px;
            color: #cccccc;
        }

        .result-box span {
            font-weight: bold;
            color: #00cb49;
        }

        @media (max-width: 480px) {
            .ad-container {
                min-height: 50px;
            }
            .calculator-box {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- একমাত্র বিজ্ঞাপন স্পেস (ক্যালকুলেটরের ঠিক ওপরে) -->
        <div class="ad-container">
            <!-- Adsterra কোড পাওয়ার পর এই লাইনের নিচের অংশটুকু পরিবর্তন করবেন -->
            <span style="color: #444; font-size: 12px;">Advertisement Space</span>
        </div>

        <!-- সরাসরি ক্যালকুলেটর বক্স -->
        <div class="calculator-box">
            <h3>Risk-Free Value Converter</h3>
            
            <div class="input-group">
                <label>Free Token / Bonus Amount ($)</label>
                <!-- max 6 digits input restriction -->
                <input type="number" id="bonusAmount" value="100" oninput="if(this.value.length > 6) this.value = this.value.slice(0,6);">
            </div>
            
            <div class="input-group">
                <label>Main Odds (Decimal)</label>
                <input type="number" id="mainOdds" value="2.00" step="0.01" oninput="if(this.value.length > 6) this.value = this.value.slice(0,6);">
            </div>

            <div class="input-group">
                <label>Hedge Odds (Decimal)</label>
                <input type="number" id="hedgeOdds" value="2.10" step="0.01" oninput="if(this.value.length > 6) this.value = this.value.slice(0,6);">
            </div>

            <button class="calc-btn" onclick="calculateLoop()">Calculate Risk-Free Lock</button>

            <div class="result-box" id="resultContainer">
                <p>Required Counter-Hedge Stake: <span id="requiredHedge">$0.00</span></p>
                <p>Guaranteed Clean Profit Return: <span id="guaranteedProfit">$0.00</span></p>
            </div>
        </div>

    </div>

    <script>
        function calculateLoop() {
            const bonus = parseFloat(document.getElementById('bonusAmount').value);
            const mainOdds = parseFloat(document.getElementById('mainOdds').value);
            const hedgeOdds = parseFloat(document.getElementById('hedgeOdds').value);

            if(isNaN(bonus) || isNaN(mainOdds) || isNaN(hedgeOdds) || bonus <= 0 || mainOdds <= 1 || hedgeOdds <= 1) {
                alert("Please enter valid parameters. Odds metrics must be greater than 1.00.");
                return;
            }

            const hedgeStake = (bonus * (mainOdds - 1)) / hedgeOdds;
            const netProfit = hedgeStake * (hedgeOdds - 1);

            document.getElementById('requiredHedge').innerText = "$" + hedgeStake.toFixed(2);
            document.getElementById('guaranteedProfit').innerText = "$" + netProfit.toFixed(2);
            document.getElementById('resultContainer').style.display = "block";
        }
    </script>
</body>
</html>
